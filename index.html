<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBEPHONE RD | SUPREME ENTERPRISE SYSTEM</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root { --v-blue: #0071e3; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #ffffff; color: #000; margin: 0; overflow-x: hidden; }
        
        /* DISEÑO EXAGERADO DE 70PX */
        .p-card-elite { 
            border-radius: 70px; padding: 45px; background: #fff; 
            border: 1px solid #f2f2f2; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .p-card-elite:hover { transform: translateY(-20px); box-shadow: 0 60px 100px rgba(0,0,0,0.08); }
        
        /* IMAGEN AJUSTADA PARA PC Y MÓVIL */
        .p-img-fit { 
            height: 280px; width: 100%; object-fit: contain; 
            margin-bottom: 25px; filter: drop-shadow(0 20px 35px rgba(0,0,0,0.1));
        }

        /* LOGO CON ACCESO POR PRESIÓN (3 SEGUNDOS EN MÓVIL) */
        .v-logo-master { 
            width: 85px; height: 85px; background: #000; border-radius: 22px; 
            display: flex; align-items: center; justify-content: center; 
            color: #fff; font-weight: 800; font-size: 40px; cursor: pointer;
            user-select: none; -webkit-touch-callout: none;
        }

        /* PANEL ADMINISTRADOR MASIVO (Imagen 1 y 2) */
        #portal-admin { 
            display: none; position: fixed; inset: 0; z-index: 10000; 
            background: #ffffff; overflow-y: auto; padding: 60px; 
        }
        #portal-admin.active { display: block; animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .vibe-input-big { 
            border-bottom: 4px solid #f5f5f7; padding: 20px 0; width: 100%; 
            outline: none; font-size: 22px; font-weight: 800; margin-bottom: 25px;
            background: transparent;
        }

        /* SISTEMA DE TOAST */
        #toast-center { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 20000; }

        @media (max-width: 768px) {
            .p-card-elite { border-radius: 45px; padding: 25px; }
            .p-img-fit { height: 200px; }
            #portal-admin { padding: 30px; }
            .v-logo-master { width: 65px; height: 65px; font-size: 30px; }
        }
    </style>
</head>
<body>

    <nav class="max-w-[1600px] mx-auto px-10 py-12 flex justify-between items-center bg-white/90 backdrop-blur-xl sticky top-0 z-[5000]">
        <div class="flex items-center gap-8">
            <div id="v-logo-trigger" class="v-logo-master">V</div>
            <div>
                <h1 class="text-3xl font-800 tracking-tighter uppercase leading-none">VibePhoneRD</h1>
                <p class="text-[10px] font-bold text-blue-600 tracking-[8px] uppercase mt-3">Enterprise Dominican Republic</p>
            </div>
        </div>
        <div class="relative cursor-pointer" onclick="ui.toggleCart()">
            <i class="fa-solid fa-bag-shopping text-4xl"></i>
            <span id="cart-counter" class="absolute -top-3 -right-3 bg-red-600 text-white text-[11px] w-7 h-7 rounded-full flex items-center justify-center font-800 border-4 border-white">0</span>
        </div>
    </nav>

    <main id="main-grid" class="max-w-[1600px] mx-auto px-10 py-20 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12"></main>

    <footer class="bg-white border-t py-40 px-10 mt-20">
        <div class="max-w-[1500px] mx-auto grid grid-cols-1 md:grid-cols-3 gap-32">
            <div><h3 class="text-5xl font-800 italic uppercase">VibePhone<br>RD</h3></div>
            <div id="footer-loc-section" class="hidden space-y-4">
                <p class="font-800 text-[11px] uppercase tracking-[6px] text-blue-600">Sede Oficial</p>
                <p id="footer-address" class="text-2xl font-bold italic text-gray-800"></p>
            </div>
            <div class="space-y-4">
                <p class="font-800 text-[11px] uppercase tracking-[6px] text-red-600">Soporte 24/7</p>
                <p class="text-6xl font-800 italic tracking-tighter">809-818-2320</p>
            </div>
        </div>
    </footer>

    <div id="portal-admin">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-end mb-24 border-b-8 border-black pb-12">
                <h2 class="text-7xl font-800 italic uppercase leading-[0.8]">Master<br>Control</h2>
                <button onclick="logic.closeAdmin()" class="bg-red-600 text-white px-12 py-5 rounded-2xl font-800 text-xs tracking-widest">CERRAR SESIÓN</button>
            </div>

            <div class="grid lg:grid-cols-2 gap-24">
                <div class="space-y-6">
                    <h4 class="text-xs font-800 text-blue-600 uppercase tracking-widest">Inventario Público</h4>
                    <input type="text" id="p-n" placeholder="Nombre del Equipo" class="vibe-input-big">
                    <input type="number" id="p-p" placeholder="Precio RD$" class="vibe-input-big">
                    <input type="text" id="p-u" placeholder="URL de la Imagen" class="vibe-input-big">
                    <input type="text" id="p-oferta" placeholder="Etiqueta de Oferta" class="vibe-input-big">
                    <textarea id="p-desc" placeholder="Descripción Detallada" class="vibe-input-big h-32"></textarea>
                    <button onclick="logic.addProduct()" class="w-full bg-black text-white py-7 rounded-2xl font-800 uppercase tracking-widest shadow-2xl">Publicar Producto</button>
                </div>

                <div class="bg-zinc-50 p-12 rounded-[60px] space-y-10 shadow-inner">
                    <div class="grid grid-cols-2 gap-8">
                        <div class="bg-white p-10 rounded-3xl shadow-sm">
                            <p class="text-[10px] font-bold opacity-30 uppercase tracking-widest">Stock</p>
                            <h5 id="adm-count" class="text-5xl font-800 mt-2">0</h5>
                        </div>
                        <div class="bg-white p-10 rounded-3xl shadow-sm">
                            <p class="text-[10px] font-bold opacity-30 uppercase tracking-widest">Valor</p>
                            <h5 id="adm-cash" class="text-5xl font-800 mt-2">0</h5>
                        </div>
                    </div>
                    
                    <canvas id="salesChart" height="200"></canvas>

                    <h4 class="text-xs font-800 text-red-600 uppercase tracking-widest mt-12">Configuración de Seguridad</h4>
                    <input type="text" id="priv-bank" placeholder="Banco de Depósito" class="vibe-input-big !bg-transparent">
                    <input type="text" id="priv-acc" placeholder="Número de Cuenta" class="vibe-input-big !bg-transparent">
                    <input type="text" id="add-loc" placeholder="Dirección para el Footer" class="vibe-input-big !bg-transparent">
                    <button onclick="logic.saveSettings()" class="w-full bg-blue-600 text-white py-7 rounded-2xl font-800 uppercase shadow-xl">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-center"></div>

    <script>
        // CONFIGURACIÓN EMAILJS (Tus códigos)
        (function() { emailjs.init("YFdmH2dv7ubtkJzod"); })();

        // CONFIGURACIÓN FIREBASE (PROYECTO: mi tienda - aaf07)
        const firebaseConfig = {
            apiKey: "AIzaSyByV8-3X8kR_TlxV7-H6m5jW7L-p_z1r4",
            projectId: "mi-tienda-aaf07"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const logic = {
            async init() {
                this.loadProducts();
                this.renderStats();
            },
            async loadProducts() {
                const snap = await db.collection("productos").get();
                const grid = document.getElementById('main-grid');
                grid.innerHTML = snap.docs.map(doc => {
                    const d = doc.data();
                    return `
                        <div class="p-card-elite">
                            <img src="${d.url}" class="p-img-fit">
                            <h4 class="text-2xl font-800 italic uppercase mb-2 tracking-tighter">${d.n}</h4>
                            <p class="text-4xl font-800 text-blue-600 italic mb-8">RD$ ${Number(d.p).toLocaleString()}</p>
                            <button onclick="logic.order('${d.n}', '${d.p}')" class="bg-black text-white px-10 py-4 rounded-2xl font-800 text-[10px] uppercase hover:bg-blue-600 transition-all">Comprar</button>
                        </div>
                    `;
                }).join('');
            },
            async addProduct() {
                const data = {
                    n: document.getElementById('p-n').value,
                    p: Number(document.getElementById('p-p').value),
                    url: document.getElementById('p-u').value,
                    oferta: document.getElementById('p-oferta').value,
                    desc: document.getElementById('p-desc').value
                };
                await db.collection("productos").add(data);
                ui.toast("PRODUCTO AGREGADO AL INVENTARIO");
                location.reload();
            },
            async saveSettings() {
                const loc = document.getElementById('add-loc').value;
                await db.collection("config").doc("global").set({ address: loc });
                ui.toast("DATOS ACTUALIZADOS");
                location.reload();
            },
            async order(name, price) {
                // ENVÍO POR EMAILJS
                emailjs.send("service_Avd121094", "template_7gaxuld", {
                    item_name: name,
                    item_price: price,
                    customer_action: "Interés de compra"
                }).then(() => {
                    ui.toast("PEDIDO ENVIADO AL ADMINISTRADOR");
                    const c = document.getElementById('cart-counter');
                    c.innerText = parseInt(c.innerText) + 1;
                });
            },
            async renderStats() {
                const snap = await db.collection("productos").get();
                const config = await db.collection("config").doc("global").get();
                
                document.getElementById('adm-count').innerText = snap.size;
                let total = 0; 
                snap.forEach(d => total += Number(d.data().p));
                document.getElementById('adm-cash').innerText = "RD$ " + (total/1000).toFixed(0) + "k";

                if(config.exists && config.data().address) {
                    document.getElementById('footer-loc-section').classList.remove('hidden');
                    document.getElementById('footer-address').innerText = config.data().address;
                }

                // Gráfica de Ventas (Imagen 1)
                new Chart(document.getElementById('salesChart'), {
                    type: 'line',
                    data: { labels: ['L','M','X','J','V','S','D'], datasets: [{ data: [15,25,20,35,30,45,40], borderColor: '#000', borderWidth: 5, tension: 0.4, pointRadius: 0 }] },
                    options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
                });
            },
            closeAdmin() { document.getElementById('portal-admin').classList.remove('active'); }
        };

        const ui = {
            toast(m) {
                const t = document.createElement('div');
                t.className = "bg-black text-white px-12 py-6 rounded-[40px] font-800 text-xs tracking-widest shadow-2xl mb-4";
                t.innerText = m;
                document.getElementById('toast-center').appendChild(t);
                setTimeout(() => t.remove(), 4000);
            }
        };

        // ACCESO PC (ALT + A)
        window.addEventListener('keydown', (e) => {
            if(e.altKey && e.key === 'a') {
                if(prompt("SISTEMA BLOQUEADO. CLAVE:") === "Avd121094") document.getElementById('portal-admin').classList.add('active');
            }
        });

        // ACCESO MÓVIL (LOGO 3 SEGUNDOS)
        const logo = document.getElementById('v-logo-trigger');
        let timer;
        logo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            timer = setTimeout(() => {
                if(prompt("ACCESO MAESTRO:") === "Avd121094") document.getElementById('portal-admin').classList.add('active');
            }, 3000);
        });
        logo.addEventListener('touchend', () => clearTimeout(timer));

        logic.init();
    </script>
</body>
</html>
