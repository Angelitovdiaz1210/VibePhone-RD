<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VibeMaster Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

body{
background:#050816;
color:white;
font-family:Arial;
overflow-x:hidden;
}

.glass{
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.08);
}

.sidebar{
width:300px;
}

.tab{
display:none;
}

.tab.active{
display:block;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="login"
class="fixed inset-0 bg-[#050816] flex items-center justify-center z-50">

<div class="glass p-10 rounded-[3rem] w-full max-w-md text-center">

<h1 class="text-4xl font-black mb-6">
VibeMaster
</h1>

<input
type="password"
id="pass"
placeholder="Código"
class="w-full p-5 rounded-2xl bg-white/5 mb-6">

<button
onclick="login()"
class="bg-cyan-500 w-full py-5 rounded-2xl font-black">

ENTRAR

</button>

</div>

</div>

<div class="flex">

<!-- SIDEBAR -->

<aside class="sidebar glass min-h-screen p-5">

<h2 class="text-3xl font-black mb-10">
VibeMaster
</h2>

<div class="space-y-3">

<button onclick="showTab('inventoryTab')"
class="w-full bg-white/5 p-4 rounded-2xl text-left">

Inventario

</button>

<button onclick="showTab('carouselTab')"
class="w-full bg-white/5 p-4 rounded-2xl text-left">

Carrusel

</button>

<button onclick="showTab('musicTab')"
class="w-full bg-white/5 p-4 rounded-2xl text-left">

Música

</button>

<button onclick="showTab('policyTab')"
class="w-full bg-white/5 p-4 rounded-2xl text-left">

Políticas

</button>

</div>

</aside>

<!-- CONTENT -->

<main class="flex-1 p-10">

<!-- INVENTARIO -->

<div id="inventoryTab"
class="tab active">

<div class="glass p-8 rounded-[2rem]">

<h2 class="text-4xl font-black mb-8">
Inventario
</h2>

<form id="productForm"
class="grid md:grid-cols-2 gap-5">

<input type="text"
placeholder="Nombre"
required
class="p-5 rounded-2xl bg-white/5">

<input type="number"
placeholder="Precio"
required
class="p-5 rounded-2xl bg-white/5">

<input type="text"
placeholder="Capacidad"
required
class="p-5 rounded-2xl bg-white/5">

<input type="text"
placeholder="URL Imagen"
required
class="p-5 rounded-2xl bg-white/5">

<button
class="bg-cyan-500 py-5 rounded-2xl font-black md:col-span-2">

Guardar

</button>

</form>

<div id="inventoryList"
class="mt-10 space-y-5">

</div>

</div>

</div>

<!-- CARRUSEL -->

<div id="carouselTab"
class="tab">

<div class="glass p-8 rounded-[2rem]">

<h2 class="text-4xl font-black mb-8">
Carrusel
</h2>

<form id="slideForm"
class="grid md:grid-cols-2 gap-5">

<input type="text"
placeholder="Título"
required
class="p-5 rounded-2xl bg-white/5">

<input type="text"
placeholder="URL Imagen"
required
class="p-5 rounded-2xl bg-white/5">

<button
class="bg-cyan-500 py-5 rounded-2xl font-black md:col-span-2">

Agregar Slide

</button>

</form>

<div id="slidesList"
class="mt-10 space-y-5">

</div>

</div>

</div>

<!-- MUSIC -->

<div id="musicTab"
class="tab">

<div class="glass p-8 rounded-[2rem]">

<h2 class="text-4xl font-black mb-8">
Música
</h2>

<input
type="text"
id="musicUrl"
placeholder="URL MP3"
class="w-full p-5 rounded-2xl bg-white/5 mb-5">

<input
type="file"
id="musicFile"
accept="audio/*"
class="mb-5">

<button
onclick="saveMusicUrl()"
class="bg-cyan-500 px-6 py-4 rounded-2xl font-black">

Guardar Música

</button>

</div>

</div>

<!-- POLÍTICAS -->

<div id="policyTab"
class="tab">

<div class="glass p-8 rounded-[2rem]">

<h2 class="text-4xl font-black mb-8">
Políticas
</h2>

<textarea
id="policyText"
class="w-full h-72 p-5 rounded-2xl bg-white/5"></textarea>

<button
onclick="savePolicies()"
class="bg-cyan-500 px-6 py-4 rounded-2xl font-black mt-5">

Guardar

</button>

</div>

</div>

</main>

</div>

<script>

/* LOGIN */

function login(){

const pass=
document.getElementById('pass').value;

if(pass==='2026'){

document.getElementById('login')
.style.display='none';

}else{

alert('Código incorrecto');

}

}

/* TABS */

function showTab(id){

document.querySelectorAll('.tab')
.forEach(t=>t.classList.remove('active'));

document.getElementById(id)
.classList.add('active');

}

/* INVENTARIO */

let inventory=
JSON.parse(localStorage.getItem('vibe_inventory'))||[];

function renderInventory(){

const list=
document.getElementById('inventoryList');

list.innerHTML='';

inventory.forEach(product=>{

list.innerHTML+=`

<div class="glass p-5 rounded-2xl flex justify-between items-center">

<div>

<h3 class="font-black text-2xl">
${product.name}
</h3>

<p class="text-gray-400">
RD$${product.price}
</p>

</div>

<button
onclick="deleteProduct(${product.id})"
class="bg-red-500 px-5 py-3 rounded-xl">

Eliminar

</button>

</div>

`;

});

}

renderInventory();

document.getElementById('productForm')
.addEventListener('submit',e=>{

e.preventDefault();

const f=e.target.elements;

inventory.push({

id:Date.now(),

name:f[0].value,

price:f[1].value,

capacity:f[2].value,

image:f[3].value

});

localStorage.setItem(
'vibe_inventory',
JSON.stringify(inventory)
);

renderInventory();

e.target.reset();

});

/* DELETE */

function deleteProduct(id){

inventory=
inventory.filter(p=>p.id!==id);

localStorage.setItem(
'vibe_inventory',
JSON.stringify(inventory)
);

renderInventory();

}

/* CARRUSEL */

let slides=
JSON.parse(localStorage.getItem('vibe_slides'))||[];

function renderSlides(){

const list=
document.getElementById('slidesList');

list.innerHTML='';

slides.forEach(slide=>{

list.innerHTML+=`

<div class="glass p-5 rounded-2xl">

<h3 class="font-black text-2xl">
${slide.title}
</h3>

<img
src="${slide.img}"
class="w-full h-52 object-cover rounded-2xl mt-4">

</div>

`;

});

}

renderSlides();

document.getElementById('slideForm')
.addEventListener('submit',e=>{

e.preventDefault();

const f=e.target.elements;

slides.push({

title:f[0].value,
img:f[1].value

});

localStorage.setItem(
'vibe_slides',
JSON.stringify(slides)
);

renderSlides();

e.target.reset();

});

/* MÚSICA */

function saveMusicUrl(){

const url=
document.getElementById('musicUrl').value;

localStorage.setItem(
'vibe_music',
url
);

alert('Música guardada');

}

document.getElementById('musicFile')
.addEventListener('change',e=>{

const file=e.target.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(ev){

localStorage.setItem(
'vibe_music',
ev.target.result
);

alert('Música subida');

}

reader.readAsDataURL(file);

}

});

/* POLÍTICAS */

function savePolicies(){

const text=
document.getElementById('policyText')
.value
.split('\n');

localStorage.setItem(
'vibe_policies',
JSON.stringify(text)
);

alert('Políticas guardadas');

}

</script>

</body>
</html>
