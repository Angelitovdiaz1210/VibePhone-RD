<!-- VIBEPHONE RD | WEB PÚBLICA                        -->
<!-- CONECTADA AL PANEL ADMIN                          -->

<!DOCTYPE html>
<html lang="es" class="dark">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VibePhone RD</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<style>

body{
background:#050816;
overflow-x:hidden;
font-family:Arial;
color:white;
}

.glass{
background:rgba(255,255,255,.05);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.08);
}

.product-card{
transition:.5s;
}

.product-card:hover{
transform:translateY(-10px);
box-shadow:0 0 30px rgba(0,191,255,.3);
}

.drop{
position:fixed;
top:-100px;
width:2px;
height:80px;
background:linear-gradient(transparent,rgba(255,255,255,.4));
animation:rain linear infinite;
z-index:-1;
}

@keyframes rain{
to{
transform:translateY(120vh);
}
}

.swiper{
border-radius:40px;
overflow:hidden;
}

</style>

</head>

<body>

<!-- LLUVIA -->

<div id="rain"></div>

<!-- NAVBAR -->

<header class="glass sticky top-0 z-50 p-5">

<div class="flex flex-wrap justify-between items-center">

<h1 class="text-4xl font-black">
VibePhone RD
</h1>

<div class="flex gap-4">

<button onclick="toggleMusic()"
class="bg-white/10 px-5 py-3 rounded-2xl">

<i class="fa-solid fa-music"></i>

</button>

<a href="admin.html"
class="bg-cyan-500 px-6 py-3 rounded-2xl font-black">

<i class="fa-solid fa-lock mr-2"></i>
Admin

</a>

</div>

</div>

</header>

<!-- HERO -->

<section class="p-8">

<div class="swiper mySwiper">

<div class="swiper-wrapper"
id="carouselContainer">

</div>

</div>

</section>

<!-- BUSCADOR -->

<section class="p-8">

<div class="flex flex-wrap gap-5 justify-between items-center mb-10">

<div>

<h2 class="text-5xl font-black">
Todos los teléfonos
</h2>

<p class="text-gray-400 mt-2">
iPhone, Samsung, Xiaomi, Gaming y más
</p>

</div>

<input
type="text"
id="searchInput"
placeholder="Buscar equipo..."
class="bg-white/5
border border-white/10
p-5 rounded-2xl
w-full md:w-96">

</div>

</section>

<!-- PRODUCTOS -->

<section class="p-8">

<div id="productGrid"
class="grid
grid-cols-1
sm:grid-cols-2
xl:grid-cols-4
gap-8">

</div>

</section>

<!-- POLÍTICAS -->

<section class="p-8">

<div class="glass rounded-[2rem] p-10">

<h2 class="text-4xl font-black mb-6">
Políticas de Empresa
</h2>

<div id="companyPolicies"
class="space-y-4 text-gray-300">

</div>

</div>

</section>

<!-- FOOTER -->

<footer class="mt-20 glass p-10">

<div class="grid md:grid-cols-4 gap-10">

<div>

<h3 class="text-3xl font-black">
VibePhone RD
</h3>

<p class="text-gray-400 mt-4">
Tecnología premium.
</p>

</div>

<div>

<h4 class="font-black mb-4">
Categorías
</h4>

<ul class="space-y-2 text-gray-400">

<li>iPhone</li>
<li>Samsung</li>
<li>Xiaomi</li>
<li>Gaming</li>

</ul>

</div>

<div>

<h4 class="font-black mb-4">
Contacto
</h4>

<ul class="space-y-2 text-gray-400">

<li>República Dominicana</li>
<li>809-818-2320</li>

</ul>

</div>

<div>

<h4 class="font-black mb-4">
Redes
</h4>

<div class="flex gap-5 text-2xl">

<i class="fa-brands fa-instagram"></i>
<i class="fa-brands fa-facebook"></i>
<i class="fa-brands fa-whatsapp"></i>

</div>

</div>

</div>

</footer>

<!-- AUDIO -->

<audio id="bgMusic" loop></audio>

<!-- SCRIPT -->

<script>

/* LLUVIA */

for(let i=0;i<120;i++){

const d=document.createElement('div');

d.classList.add('drop');

d.style.left=Math.random()*100+'vw';

d.style.animationDuration=
(Math.random()*1+.5)+'s';

document.getElementById('rain')
.appendChild(d);

}

/* PRODUCTOS */

let inventory=
JSON.parse(localStorage.getItem('vibe_inventory'))||[];

function renderProducts(){

const grid=
document.getElementById('productGrid');

grid.innerHTML='';

inventory.forEach(product=>{

grid.innerHTML+=`

<div class="product-card glass rounded-[2rem] overflow-hidden">

<img
src="${product.image}"
class="w-full h-72 object-cover">

<div class="p-6">

<h3 class="text-2xl font-black">
${product.name}
</h3>

<p class="text-gray-400 mt-2">
${product.capacity}
</p>

<div class="flex justify-between items-center mt-6">

<h4 class="text-3xl font-black text-cyan-400">
RD$${Number(product.price).toLocaleString()}
</h4>

<a
href="https://wa.me/18098182320?text=Hola me interesa el ${product.name}"
target="_blank"
class="bg-green-500 px-5 py-3 rounded-2xl">

<i class="fa-brands fa-whatsapp"></i>

</a>

</div>

</div>

</div>

`;

});

}

renderProducts();

/* BUSCADOR */

document.getElementById('searchInput')
.addEventListener('keyup',e=>{

const text=e.target.value.toLowerCase();

document.querySelectorAll('.product-card')
.forEach(card=>{

card.style.display=
card.innerText.toLowerCase()
.includes(text)
?'block':'none';

});

});

/* CARRUSEL */

let slides=
JSON.parse(localStorage.getItem('vibe_slides'))||[];

function renderSlides(){

const container=
document.getElementById('carouselContainer');

container.innerHTML='';

slides.forEach(slide=>{

container.innerHTML+=`

<div class="swiper-slide">

<div class="relative h-[500px]">

<img
src="${slide.img}"
class="w-full h-full object-cover">

<div class="absolute inset-0 bg-black/50 flex items-center justify-center">

<h2 class="text-6xl font-black">
${slide.title}
</h2>

</div>

</div>

</div>

`;

});

new Swiper(".mySwiper",{

loop:true,

autoplay:{
delay:3000
}

});

}

renderSlides();

/* POLÍTICAS */

let policies=
JSON.parse(localStorage.getItem('vibe_policies'))||[];

function renderPolicies(){

const div=
document.getElementById('companyPolicies');

div.innerHTML='';

policies.forEach(p=>{

div.innerHTML+=`
<p>• ${p}</p>
`;

});

}

renderPolicies();

/* MÚSICA */

const audio=
document.getElementById('bgMusic');

let music=
localStorage.getItem('vibe_music');

if(music){

audio.src=music;

audio.volume=.5;

audio.play();

}

function toggleMusic(){

if(audio.paused){

audio.play();

}else{

audio.pause();

}

}

</script>

</body>
</html>
